name: CI Pipeline (Build & Verify)

# Trigger this workflow on every push to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (A tool to build Docker images efficiently)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Build the Backend Image (Test)
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false # We are just testing the build, not pushing to registry yet
          tags: smartfinancetracker-api:latest

      # 4. Build the Frontend Image (Test)
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: smartfinancetracker-client:latest

      # 5. Success Message
      - name: Verify Build
        run: echo "✅ Docker images built successfully! The code is healthy."