name: CI Pipeline (Build & Push)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub (Using the Secrets you just added)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build and Push Backend
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true  # <--- NOW SET TO TRUE
          tags: ${{ secrets.DOCKER_USERNAME }}/smartfinancetracker-api:latest

      # 5. Build and Push Frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true  # <--- NOW SET TO TRUE
          tags: ${{ secrets.DOCKER_USERNAME }}/smartfinancetracker-client:latest

      - name: Verify
        run: echo "✅ Successfully pushed images to Docker Hub!"